<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecera('Competiciones')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu('competiciones')}"></nav>
<header class="pitch py-5">
  <div class="container py-lg-3">
    <h1 class="mb-2">Competiciones</h1>
    <p class="fs-5 mb-0">Torneos organizados por una asociación en los que juegan varios clubes.</p>
  </div>
</header>

<main class="container my-5">
  <div th:replace="~{fragments/layout :: avisos}"></div>
  <ul class="nav nav-pills mb-3">
    <li class="nav-item"><a class="nav-link active" th:href="@{/competiciones}">Listado</a></li>
    <li class="nav-item"><a class="nav-link" th:href="@{/competiciones/nuevo}">Nueva competición</a></li>
  </ul>
  <div class="panel p-0 table-responsive">
    <table class="table table-hover align-middle mb-0">
      <thead><tr><th>Nombre</th><th>Año</th><th>Sede</th><th>Asociación organizadora</th><th>Clubes participantes</th><th>Acciones registradas</th><th></th></tr></thead>
      <tbody>
        <tr th:each="fila : ${competiciones}">
          <td class="fw-semibold" th:text="${fila.nombre}"></td>
          <td th:text="${fila.anio}"></td>
          <td th:text="${fila.sede}"></td>
          <td th:text="${fila.organizador != null ? fila.organizador.nombre : '—'}"></td>
          <td><span class="badge badge-team me-1" th:each="item : ${fila.clubes}" th:if="${item != null}" th:text="${item.nombre}"></span></td>
          <td><span class="badge badge-team" th:text="${totalAcciones.get(fila.id) ?: 0}"></span></td>
          <td class="text-end text-nowrap">
            <a class="btn btn-sm btn-outline-secondary" th:href="@{/competiciones/editar/{id}(id=${fila.id})}"><i class="bi bi-pencil"></i> Editar</a>
            <form class="d-inline" th:action="@{/competiciones/eliminar/{id}(id=${fila.id})}" method="post" onsubmit="return confirm('¿Eliminar este registro?')">
              <button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash"></i> Eliminar</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(competiciones)}">
          <td colspan="7" class="text-center text-secondary py-4">Aún no hay registros. <a th:href="@{/competiciones/nuevo}">Crea el primero</a>.</td>
        </tr>
      </tbody>
    </table>
  </div>
</main>

<footer th:replace="~{fragments/layout :: pie}"></footer>
</body>
</html>
