<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="cabecera(titulo)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' - Mundial'">Mundial</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Navbar compartido por todas las páginas -->
<nav th:fragment="menu(activo)" class="navbar navbar-expand-xl navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}"><i class="bi bi-trophy-fill"></i> Mundial</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'inicio'} ? 'active'" th:href="@{/}"><i class="bi bi-house"></i> Inicio</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'asociaciones'} ? 'active'" th:href="@{/asociaciones}"><i class="bi bi-flag"></i> Asociaciones</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'estadios'} ? 'active'" th:href="@{/estadios}"><i class="bi bi-buildings"></i> Estadios</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'entrenadores'} ? 'active'" th:href="@{/entrenadores}"><i class="bi bi-person-badge"></i> Entrenadores</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'clubes'} ? 'active'" th:href="@{/clubes}"><i class="bi bi-shield-shaded"></i> Clubes</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'jugadores'} ? 'active'" th:href="@{/jugadores}"><i class="bi bi-people"></i> Jugadores</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'competiciones'} ? 'active'" th:href="@{/competiciones}"><i class="bi bi-trophy"></i> Competiciones</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'acciones'} ? 'active'" th:href="@{/acciones}"><i class="bi bi-lightning-charge"></i> Acciones</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Mensajes de éxito o error -->
<div th:fragment="avisos">
  <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${exito}">
    <span th:text="${exito}">Hecho</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
  </div>
  <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${error}">
    <span th:text="${error}">Error</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
  </div>
</div>

<footer th:fragment="pie" class="py-4 text-center text-secondary small">
  Mundial · Spring Boot, Thymeleaf y MongoDB Atlas
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>

</body>
</html>
