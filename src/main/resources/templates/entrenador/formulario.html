<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecera('Entrenadores')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu('entrenadores')}"></nav>
<header class="pitch py-5">
  <div class="container py-lg-3">
    <h1 class="mb-2">Entrenadores</h1>
    <p class="fs-5 mb-0">Directores técnicos. Un entrenador dirige a un solo club.</p>
  </div>
</header>

<main class="container my-5">
  <div th:replace="~{fragments/layout :: avisos}"></div>
  <ul class="nav nav-pills mb-3">
    <li class="nav-item"><a class="nav-link" th:href="@{/entrenadores}">Listado</a></li>
    <li class="nav-item"><a class="nav-link active" th:href="@{/entrenadores/nuevo}">Nuevo entrenador</a></li>
  </ul>
  <section class="panel">
    <h2 class="mb-4" th:text="${#strings.isEmpty(entrenador.id)} ? 'Nuevo entrenador' : 'Editar entrenador'">Nuevo entrenador</h2>
    <form th:action="@{/entrenadores/guardar}" th:object="${entrenador}" method="post" class="row g-3">
      <input type="hidden" th:field="*{id}">
      <div class="col-md-6">
        <label class="form-label" for="nombre">Nombre *</label>
        <input type="text" class="form-control" th:field="*{nombre}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="nacionalidad">Nacionalidad *</label>
        <input type="text" class="form-control" th:field="*{nacionalidad}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="edad">Edad</label>
        <input type="number" class="form-control" th:field="*{edad}">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="aniosExperiencia">Años de experiencia</label>
        <input type="number" class="form-control" th:field="*{aniosExperiencia}">
      </div>
      <div class="col-12 d-flex gap-2">
        <button class="btn btn-turf" type="submit"><i class="bi bi-check-circle"></i> Guardar</button>
        <a class="btn btn-outline-secondary" th:href="@{/entrenadores}">Cancelar</a>
      </div>
    </form>
  </section>
</main>

<footer th:replace="~{fragments/layout :: pie}"></footer>
</body>
</html>
